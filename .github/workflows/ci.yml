name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  typo3-lint:
    name: TYPO3 Extension PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: PHP syntax check
        run: find typo3/extensions -name "*.php" -exec php -l {} \;

  ios-build:
    name: iOS Build Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project DasAlteDresden/DasAlteDresden.xcodeproj \
            -scheme DasAlteDresden \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
